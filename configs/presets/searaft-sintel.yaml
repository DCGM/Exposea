# Preset for images with final resolution of around 20kx20k

final_res: [ 19200, 25200 ]
proc_res: 6000  # Resize the images so they fit into memory
eval_res: 1024

optical:
  model: sea_raft_m
  checkpoint: sintel

light_optim:
  use_tile: True
  tile_size: [4000, 4000] # Can be adjusted to fit the memory

stitcher:
  mode: actual
  blend_width: 300